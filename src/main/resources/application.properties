# Ollama Chat Configuration
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.options.model=llama3.2:3b
spring.ai.ollama.chat.options.temperature=0.7

# Ollama Embedding Configuration
spring.ai.ollama.embedding.options.model=nomic-embed-text

# ChromaDB Vector Store Configuration
spring.ai.vectorstore.chroma.host=localhost
spring.ai.vectorstore.chroma.port=8000
spring.ai.vectorstore.chroma.collection-name=rag-collection

# Logging Configuration
logging.level.com.chatbox.rag=INFO
logging.level.org.springframework.ai=DEBUG
